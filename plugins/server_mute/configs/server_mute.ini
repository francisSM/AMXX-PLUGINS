; ==============================================================================
; Configuracion de Comandos Permitidos Durante Gag (server_mute.ini)
; ==============================================================================
; Los jugadores con sancion de gag en el chat no pueden enviar mensajes publicos,
; pero si pueden ejecutar comandos utiles del servidor si estan listados aqui.
; No incluyas barras '/' ni prefijos, solo la palabra clave en minusculas.

[allowed_commands]
timeleft
thetime
nextmap
currentmap
rtv
nominate
nom
help
ayuda
rules
reglas
menu
rank
top15
stats
mute
unmute
