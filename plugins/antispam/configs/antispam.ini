; ==============================================================================
; Anti-Spam & Chat Filter Configuration (antispam.ini)
; ==============================================================================
; Configuration file for anti-spam, word blacklist, and command whitelist.
; Reload settings in-game: concmd "antispam_reload" (Admin with RCON flag).
; ==============================================================================

[settings]
; Duration in seconds of the auto-mute penalty when spam/IP/blocked word is detected
mute_duration = 60.0

; Duration in minutes of the temp-ban penalty for severe repeat offenders (Level 4+)
ban_duration = 15

; Time window (in seconds) to consider an infraction as a reoffense
reoffense_window = 45.0

; Maximum time interval (in seconds) between identical messages to count as flood
repeat_time_window = 3.0

; Prefix used to rename players whose nickname contains an IP or blacklisted word
; Resulting name will be: <rename_prefix>_<player_id> (e.g. Player_1, Player_12)
rename_prefix = "Player"

; ==============================================================================
; [blacklist]
; Forbidden words, domains, links, or phrases (enclosed in double quotes).
; If a player types them in chat or uses them in their nickname, they will be blocked.
; Example:
; "example.com"
; "badword"
; ==============================================================================
[blacklist]
; "example.com"

; ==============================================================================
; [whitelist]
; Allowed game commands or short common words that should NOT trigger flood detection
; if spammed quickly (e.g. bound keys or frequent interactions).
; Note: Messages starting with '/', '!' or '.' are already bypassed by default.
; ==============================================================================
[whitelist]
"spec"
"spectator"
"spectate"
"unspec"
"ct"
"t"
"join"
"help"
"menu"
"timeleft"
"thetime"
"tl"
"time"
"nextmap"
"currentmap"
"map"
"rtv"
"nom"
"nominate"
"maps"
"top"
"top15"
"rank"
"ranks"
"stats"
