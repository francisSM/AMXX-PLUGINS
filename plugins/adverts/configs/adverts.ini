; ==============================================================================
; Guia y Configuracion de Anuncios (adverts.ini)
; ==============================================================================
; Este archivo define los anuncios automaticos (rotativos) y los comandos por chat.
; El sistema es multi-idioma y utiliza el archivo de traduccion:
;   cstrike/addons/amxmodx/data/lang/adverts.txt
;
; ------------------------------------------------------------------------------
; Configuracion del Tag
; ------------------------------------------------------------------------------
; El tag del servidor se define en la seccion [SETTINGS] con la variable 'tag':
;    [SETTINGS]
;    tag = !g[Server]
;
; ------------------------------------------------------------------------------
; Prioridades y Frecuencia de Mensajes
; ------------------------------------------------------------------------------
; En la seccion [CHAT] o [HUD], puedes anadir un numero al lado de la clave para
; definir cuantas veces aparecera en cada ciclo de rotacion:
;    ADVERT_RULES 3      ; (Aparece 3 veces por ciclo)
;    ADVERT_WELCOME 1    ; (Aparece 1 vez por ciclo)
;
; ------------------------------------------------------------------------------
; Colores y Variables Disponibles
; ------------------------------------------------------------------------------
; Colores de chat:
;   !g o ^4  = Verde
;   !t o ^3  = Color del equipo (Azul para CT, Rojo para TT)
;   !n o ^1  = Color normal (amarillo / blanco)
;
; Variables dinamicas reemplazadas automaticamente:
;   %tag%        = Tag oficial configurado
;   %map%        = Nombre del mapa actual
;   %servername% = Nombre del servidor (hostname)
;   %newline%    = Salto de linea (para mensajes [HUD])
;
; ------------------------------------------------------------------------------
; Recarga en Vivo
; ------------------------------------------------------------------------------
; Tras editar este archivo, ejecuta en consola de admin:
;   amx_reloadadverts
; ==============================================================================

[SETTINGS]
tag = !g[Server]

[HUD]
; Ejemplos de mensajes HUD rotativos:
; Bienvenidos a %servername%%newline%Disfruta tu partida en %map%

[CHAT]
; --- Anuncios rotativos periodicos ---
ADVERT_WELCOME 2
ADVERT_RULES 2
ADVERT_DISCORD 2
ADVERT_HELP 1

; --- Disparadores de comandos por chat (Chat Triggers) ---
; Al escribir '/rules' o 'rules' en el chat, se mostrara el mensaje correspondiente
rules = ADVERT_RULES
reglas = ADVERT_RULES
discord = ADVERT_DISCORD
help = ADVERT_HELP
ayuda = ADVERT_HELP
menu = ADVERT_HELP
